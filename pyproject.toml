[project]
name = "agent-runtime-forge"
version = "0.1.0"
description = "Enterprise Agent runtime rebuilt on mainstream stacks (LangGraph/FastAPI/MCP/RAG/eval harness) - a controlled comparison against a zero-dependency in-house runtime"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "langchain>=1.5.0",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.3",
    "rank-bm25>=0.2.2",        # 纯 python 轮子；BM25 召回用它在 CI 上秒级可复现
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

# ⚠️ 依赖分层是**刻意的**：跑测试⩔ 该下载 2.5 GB 的 torch。
#    核心线（含 RAG 管线与 MCP 等价性断言）只依赖上面这些；语义档与真 MCP 传输各自 opt-in。
[project.optional-dependencies]
semantic = [                   # 真语义检索：uv sync --extra semantic
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
zh = ["jieba>=0.42"]            # 中文分词增强；缺省时 tokenize_zh 自动回退（报告会写明用的哪个）
mcp = ["mcp>=1.2"]              # 真 MCP 传输；清单/校验的等价性测试⛔ 它也能跑
server = [                       # D6 容器形态：compose 设了 DATABASE_URL ⇒ 应用 import 时就要连 Postgres，
    "psycopg[binary]>=3.1",      # 缺 psycopg 会直接 ImportError（这是好事，⛔ 悄悄回落 sqlite）
    "qdrant-client>=1.9",        # FORGE_VECTOR_URL 的客户端
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

# ⛔ 不把本项目自身装进 venv（扁平布局 + `python -m forge...` 即可），
# 但 pytest 需要仓库根在 sys.path 上，见下面 pythonpath。
[tool.uv]
package = false

# D1 故意不装 langgraph / fastapi / openai —— 按 D2/D3/D4 逐日引入，
# 每天的验收不过就不进下一步（见作品集任务书 §0 规矩 2）。

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# ⚠️ tmp_path 默认落在 C 盘用户目录下的 AppData\Local\Temp —— 本项目每个测试都要
# 往里写 sqlite checkpoint / 交接文件 / 立项草稿，全都会堆到 C 盘。
# 注意：pytest 9.2 里 basetemp **不是 ini 选项**（写成 ini 只会得到
# "Unknown config option" 警告然后照样跑 C 盘），只能走命令行 ⇒ 塞进 addopts。
# 相对路径以调用时的 cwd 为基准，所以**必须从仓库根跑**（tests/test_d2_hygiene.py 会抓）。
addopts = "-q --basetemp=.tmp/pytest"

# ⚠️ torch 必须走 CPU 索引：PyPI 默认的 win_amd64 轮子是 cu121（约 2.5 GB），
#    本项目只做 CPU 推理。写成配置而不是命令行参数，换机器才复现得出来。
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
